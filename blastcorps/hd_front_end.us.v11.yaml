options:
  base_path: .
  basename: hd_front_end.us.v11
  compiler: IDO
  create_detected_syms: yes
  find_file_boundaries: yes
  target_path: hd_front_end.us.v11.bin
  # symbol_addrs.hd_front_end.us.v11.txt + symbol_addrs.hd_code.us.v11.txt,
  # concatenated by `make extract` so calls into hd_code use hd_code's names
  symbol_addrs_path: symbol_addrs_auto.hd_front_end.us.v11.txt
  undefined_funcs_auto_path: undefined_funcs_auto.hd_front_end.us.v11.txt
  undefined_syms_auto_path: undefined_syms_auto.hd_front_end.us.v11.txt
  src_path: src.us.v11
segments:
  # The front end is inflated once by hd_code func_8028B3E0 (46C20.c) to
  # 0x801E7000: osInvalDCache(0x801E7000, 0x37D00), then the gzip inflate of
  # ROM 0x7E3AD0 (text) / 0x7F63A1 (data) to that address. 307 of the 917 jal
  # words in the text land inside it at this base, all on function starts.
  # File boundaries: splat find_file_boundaries (16-aligned, nop-padded ends).
  - name:  hd_front_end
    type:  code
    vram:  0x801E7000
    start: 0x00000000
    subsegments:
    - [0x00000, c, hd_front_end/00000]
    - [0x01C40, c, hd_front_end/01C40]
    - [0x06790, c, hd_front_end/06790]
    - [0x07390, c, hd_front_end/07390]
    - [0x07800, c, hd_front_end/07800]
    - [0x09570, c, hd_front_end/09570]
    - [0x0DE70, c, hd_front_end/0DE70]
    - [0x0E7B0, c, hd_front_end/0E7B0]
    - [0x11530, c, hd_front_end/11530]
    - [0x17990, c, hd_front_end/17990]
    - [0x196F0, c, hd_front_end/196F0]
    - [0x1A240, c, hd_front_end/1A240]
    - [0x1AE80, c, hd_front_end/1AE80]
    - [0x1B730, c, hd_front_end/1B730]
    - [0x1B880, c, hd_front_end/1B880]
    - [0x1B8F0, c, hd_front_end/1B8F0]
    - [0x1CCC0, c, hd_front_end/1CCC0]
    - [0x1D2D0, c, hd_front_end/1D2D0]
    - [0x1D410, c, hd_front_end/1D410]
    - [0x1D550, c, hd_front_end/1D550]
    - [0x1D710, c, hd_front_end/1D710]
    - [0x1DC10, c, hd_front_end/1DC10]
    - [0x1E3F0, c, hd_front_end/1E3F0]
    - [0x1F5C0, c, hd_front_end/1F5C0]
    - [0x1F970, c, hd_front_end/1F970]
    - [0x1FD20, c, hd_front_end/1FD20]
    - [0x20090, bin, hd_front_end/20090] # RSP microcode (IMEM text; hd_code func_80284DB0 DMAs D_80207090)
    - [0x21040, linker, data]
    - [0x21040, bin, hd_front_end/hd_front_end_data] # .data/.rodata (vram 0x80208040)
  - [0x29E90]
